<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 880px;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1e293b;
    padding: 30px 40px;
  }
  .header {
    text-align: center;
    margin-bottom: 25px;
  }
  .school-tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #0369a1;
  }
  .title {
    font-size: 20px;
    font-weight: 800;
    color: #0f172a;
    margin-top: 4px;
  }
  .subtitle {
    font-size: 12px;
    color: #64748b;
    margin-top: 2px;
  }
  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 10px;
    font-size: 11px;
    color: #475569;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .badge {
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 9px;
    font-weight: 800;
  }
  .badge-pk { background: #0f172a; color: #fff; }
  .badge-fk { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
  .badge-ak { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }

  svg {
    width: 100%;
    height: 720px;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="school-tag">Placido L. Señor National High School</div>
    <div class="title">Core 5-Table Database Flow (Enrollment & Student Management)</div>
    <div class="subtitle">Normalized Relational Architecture with Correct Crow's Foot Cardinalities</div>
    <div class="legend">
      <div class="legend-item"><span class="badge badge-pk">PK</span> Primary Key</div>
      <div class="legend-item"><span class="badge badge-fk">FK</span> Foreign Key</div>
      <div class="legend-item"><span class="badge badge-ak">AK</span> Alternate / Unique Key</div>
      <div class="legend-item"><span>||&mdash;&mdash;&lt;</span> One-to-Many Relationship</div>
      <div class="legend-item"><span>||&mdash;&mdash;||</span> One-to-One Relationship</div>
    </div>
  </div>

  <svg viewBox="0 0 1120 680">
    <defs>
      <!-- Shadow filter for clean card depth -->
      <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="108%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
      </filter>
      <!-- Crow foot & bar markers -->
      <marker id="one-start" viewBox="0 0 16 16" refX="2" refY="8" markerWidth="10" markerHeight="10" orient="auto">
        <line x1="6" y1="2" x2="6" y2="14" stroke="#334155" stroke-width="1.8"/>
        <line x1="10" y1="2" x2="10" y2="14" stroke="#334155" stroke-width="1.8"/>
      </marker>
      <marker id="many-end" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="12" markerHeight="12" orient="auto">
        <line x1="14" y1="2" x2="2" y2="8" stroke="#334155" stroke-width="1.8"/>
        <line x1="14" y1="14" x2="2" y2="8" stroke="#334155" stroke-width="1.8"/>
        <line x1="14" y1="8" x2="2" y2="8" stroke="#334155" stroke-width="1.8"/>
        <line x1="6" y1="2" x2="6" y2="14" stroke="#334155" stroke-width="1.8"/>
      </marker>
      <marker id="one-end" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="10" markerHeight="10" orient="auto">
        <line x1="6" y1="2" x2="6" y2="14" stroke="#334155" stroke-width="1.8"/>
        <line x1="10" y1="2" x2="10" y2="14" stroke="#334155" stroke-width="1.8"/>
      </marker>
    </defs>

    <!-- RELATIONSHIP LINES -->
    <!-- 1. users (one) to students (one) -->
    <!-- users right (370, 160) -> students left (450, 160) -->
    <path d="M 370 145 L 440 145" fill="none" stroke="#334155" stroke-width="1.8" marker-start="url(#one-start)" marker-end="url(#one-end)"/>
    <text x="405" y="137" font-size="10" font-family="Arial" fill="#64748b" text-anchor="middle">1 : 0..1</text>

    <!-- 2. users (one) to sections (many) via adviser_id -->
    <!-- users (240, 260) -> sections (240, 370) -->
    <path d="M 240 285 L 240 380" fill="none" stroke="#334155" stroke-width="1.8" marker-start="url(#one-start)" marker-end="url(#many-end)"/>
    <text x="250" y="335" font-size="10" font-family="Arial" fill="#64748b">1 : N (adviser)</text>

    <!-- 3. sections (one) to students (many) via section_id -->
    <!-- sections right (370, 480) -> students (450, 280) -->
    <path d="M 370 480 L 410 480 L 410 240 L 440 240" fill="none" stroke="#334155" stroke-width="1.8" marker-start="url(#one-start)" marker-end="url(#many-end)"/>
    <text x="415" y="360" font-size="10" font-family="Arial" fill="#64748b">1 : N</text>

    <!-- 4. students (one) to enrollments (many) via student_id -->
    <!-- students right (730, 160) -> enrollments left (800, 160) -->
    <path d="M 720 160 L 800 160" fill="none" stroke="#334155" stroke-width="1.8" marker-start="url(#one-start)" marker-end="url(#many-end)"/>
    <text x="760" y="152" font-size="10" font-family="Arial" fill="#64748b" text-anchor="middle">1 : N</text>

    <!-- 5. enrollments (one) to documents (many) via enrollment_id -->
    <!-- enrollments bottom (945, 370) -> documents top (945, 430) -->
    <path d="M 945 355 L 945 440" fill="none" stroke="#334155" stroke-width="1.8" marker-start="url(#one-start)" marker-end="url(#many-end)"/>
    <text x="955" y="400" font-size="10" font-family="Arial" fill="#64748b">1 : N</text>


    <!-- ========================================== -->
    <!-- TABLE 1: USERS -->
    <!-- ========================================== -->
    <g transform="translate(90, 40)" filter="url(#card-shadow)">
      <rect width="280" height="245" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="280" height="32" rx="6" fill="#0f172a"/>
      <rect y="26" width="280" height="6" fill="#0f172a"/>
      <text x="140" y="21" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">users</text>
      <!-- Columns -->
      <g transform="translate(14, 48)" font-family="monospace" font-size="11">
        <!-- PK id -->
        <rect x="0" y="-10" width="22" height="13" rx="2" fill="#0f172a"/>
        <text x="11" y="0" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Arial">PK</text>
        <text x="28" y="0" font-weight="700" fill="#0f172a">id</text>
        <text x="250" y="0" fill="#64748b" text-anchor="end">uuid</text>

        <!-- AK email -->
        <g transform="translate(0, 22)">
          <rect x="0" y="-10" width="22" height="13" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.5"/>
          <text x="11" y="0" font-size="8" font-weight="700" fill="#b45309" text-anchor="middle" font-family="Arial">AK</text>
          <text x="28" y="0" font-weight="600" fill="#0f172a">email</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- password -->
        <g transform="translate(0, 44)">
          <text x="28" y="0" fill="#334155">password</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- role -->
        <g transform="translate(0, 66)">
          <text x="28" y="0" font-weight="600" fill="#0369a1">role</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- first_name -->
        <g transform="translate(0, 88)">
          <text x="28" y="0" fill="#334155">first_name</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- last_name -->
        <g transform="translate(0, 110)">
          <text x="28" y="0" fill="#334155">last_name</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- contact_number -->
        <g transform="translate(0, 132)">
          <text x="28" y="0" fill="#334155">contact_number</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- address -->
        <g transform="translate(0, 154)">
          <text x="28" y="0" fill="#334155">address</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- created_at -->
        <g transform="translate(0, 176)">
          <text x="28" y="0" fill="#64748b">created_at</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">timestamptz</text>
        </g>
      </g>
    </g>


    <!-- ========================================== -->
    <!-- TABLE 2: SECTIONS -->
    <!-- ========================================== -->
    <g transform="translate(90, 380)" filter="url(#card-shadow)">
      <rect width="280" height="205" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="280" height="32" rx="6" fill="#0f172a"/>
      <rect y="26" width="280" height="6" fill="#0f172a"/>
      <text x="140" y="21" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">sections</text>
      <!-- Columns -->
      <g transform="translate(14, 48)" font-family="monospace" font-size="11">
        <!-- PK id -->
        <rect x="0" y="-10" width="22" height="13" rx="2" fill="#0f172a"/>
        <text x="11" y="0" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Arial">PK</text>
        <text x="28" y="0" font-weight="700" fill="#0f172a">id</text>
        <text x="250" y="0" fill="#64748b" text-anchor="end">uuid</text>

        <!-- name -->
        <g transform="translate(0, 22)">
          <text x="28" y="0" font-weight="600" fill="#0f172a">name</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- grade_level -->
        <g transform="translate(0, 44)">
          <text x="28" y="0" fill="#334155">grade_level</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- strand -->
        <g transform="translate(0, 66)">
          <text x="28" y="0" fill="#334155">strand</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- FK adviser_id -->
        <g transform="translate(0, 88)">
          <rect x="0" y="-10" width="22" height="13" rx="2" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.5"/>
          <text x="11" y="0" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle" font-family="Arial">FK</text>
          <text x="28" y="0" font-weight="600" fill="#0369a1">adviser_id</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">uuid</text>
        </g>
        <!-- room -->
        <g transform="translate(0, 110)">
          <text x="28" y="0" fill="#334155">room</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- created_at -->
        <g transform="translate(0, 132)">
          <text x="28" y="0" fill="#64748b">created_at</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">timestamptz</text>
        </g>
      </g>
    </g>


    <!-- ========================================== -->
    <!-- TABLE 3: STUDENTS -->
    <!-- ========================================== -->
    <g transform="translate(440, 40)" filter="url(#card-shadow)">
      <rect width="280" height="340" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="280" height="32" rx="6" fill="#0f172a"/>
      <rect y="26" width="280" height="6" fill="#0f172a"/>
      <text x="140" y="21" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">students</text>
      <!-- Columns -->
      <g transform="translate(14, 48)" font-family="monospace" font-size="11">
        <!-- PK id -->
        <rect x="0" y="-10" width="22" height="13" rx="2" fill="#0f172a"/>
        <text x="11" y="0" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Arial">PK</text>
        <text x="28" y="0" font-weight="700" fill="#0f172a">id</text>
        <text x="250" y="0" fill="#64748b" text-anchor="end">uuid</text>

        <!-- FK user_id -->
        <g transform="translate(0, 22)">
          <rect x="0" y="-10" width="22" height="13" rx="2" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.5"/>
          <text x="11" y="0" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle" font-family="Arial">FK</text>
          <text x="28" y="0" font-weight="600" fill="#0369a1">user_id</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">uuid</text>
        </g>
        <!-- AK lrn -->
        <g transform="translate(0, 44)">
          <rect x="0" y="-10" width="22" height="13" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.5"/>
          <text x="11" y="0" font-size="8" font-weight="700" fill="#b45309" text-anchor="middle" font-family="Arial">AK</text>
          <text x="28" y="0" font-weight="700" fill="#0f172a">lrn</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- first_name -->
        <g transform="translate(0, 66)">
          <text x="28" y="0" fill="#334155">first_name</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- last_name -->
        <g transform="translate(0, 88)">
          <text x="28" y="0" fill="#334155">last_name</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- gender -->
        <g transform="translate(0, 110)">
          <text x="28" y="0" fill="#334155">gender</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- date_of_birth -->
        <g transform="translate(0, 132)">
          <text x="28" y="0" fill="#334155">date_of_birth</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">date</text>
        </g>
        <!-- contact_number -->
        <g transform="translate(0, 154)">
          <text x="28" y="0" fill="#334155">contact_number</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- email -->
        <g transform="translate(0, 176)">
          <text x="28" y="0" fill="#334155">email</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- FK parent_id -->
        <g transform="translate(0, 198)">
          <rect x="0" y="-10" width="22" height="13" rx="2" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.5"/>
          <text x="11" y="0" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle" font-family="Arial">FK</text>
          <text x="28" y="0" font-weight="600" fill="#0369a1">parent_id</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">uuid</text>
        </g>
        <!-- FK section_id -->
        <g transform="translate(0, 220)">
          <rect x="0" y="-10" width="22" height="13" rx="2" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.5"/>
          <text x="11" y="0" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle" font-family="Arial">FK</text>
          <text x="28" y="0" font-weight="600" fill="#0369a1">section_id</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">uuid</text>
        </g>
        <!-- grade_level -->
        <g transform="translate(0, 242)">
          <text x="28" y="0" fill="#334155">grade_level</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- strand -->
        <g transform="translate(0, 264)">
          <text x="28" y="0" fill="#334155">strand</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- status -->
        <g transform="translate(0, 286)">
          <text x="28" y="0" font-weight="600" fill="#15803d">status</text>
          <text x="250" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
      </g>
    </g>


    <!-- ========================================== -->
    <!-- TABLE 4: ENROLLMENTS -->
    <!-- ========================================== -->
    <g transform="translate(800, 40)" filter="url(#card-shadow)">
      <rect width="290" height="315" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="290" height="32" rx="6" fill="#0f172a"/>
      <rect y="26" width="290" height="6" fill="#0f172a"/>
      <text x="145" y="21" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">enrollments</text>
      <!-- Columns -->
      <g transform="translate(14, 48)" font-family="monospace" font-size="11">
        <!-- PK id -->
        <rect x="0" y="-10" width="22" height="13" rx="2" fill="#0f172a"/>
        <text x="11" y="0" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Arial">PK</text>
        <text x="28" y="0" font-weight="700" fill="#0f172a">id</text>
        <text x="260" y="0" fill="#64748b" text-anchor="end">uuid</text>

        <!-- FK student_id -->
        <g transform="translate(0, 22)">
          <rect x="0" y="-10" width="22" height="13" rx="2" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.5"/>
          <text x="11" y="0" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle" font-family="Arial">FK</text>
          <text x="28" y="0" font-weight="600" fill="#0369a1">student_id</text>
          <text x="260" y="0" fill="#64748b" text-anchor="end">uuid</text>
        </g>
        <!-- grade_level -->
        <g transform="translate(0, 44)">
          <text x="28" y="0" fill="#334155">grade_level</text>
          <text x="260" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- strand -->
        <g transform="translate(0, 66)">
          <text x="28" y="0" font-weight="600" fill="#0f172a">strand</text>
          <text x="260" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- school_year -->
        <g transform="translate(0, 88)">
          <text x="28" y="0" fill="#334155">school_year</text>
          <text x="260" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- previous_school -->
        <g transform="translate(0, 110)">
          <text x="28" y="0" fill="#334155">previous_school</text>
          <text x="260" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- general_average -->
        <g transform="translate(0, 132)">
          <text x="28" y="0" fill="#334155">general_average</text>
          <text x="260" y="0" fill="#64748b" text-anchor="end">numeric</text>
        </g>
        <!-- status -->
        <g transform="translate(0, 154)">
          <text x="28" y="0" font-weight="700" fill="#0369a1">status</text>
          <text x="260" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- created_at -->
        <g transform="translate(0, 176)">
          <text x="28" y="0" fill="#64748b">created_at</text>
          <text x="260" y="0" fill="#64748b" text-anchor="end">timestamptz</text>
        </g>
        <!-- enrolled_date -->
        <g transform="translate(0, 198)">
          <text x="28" y="0" fill="#64748b">enrolled_date</text>
          <text x="260" y="0" fill="#64748b" text-anchor="end">timestamptz</text>
        </g>
      </g>
    </g>


    <!-- ========================================== -->
    <!-- TABLE 5: DOCUMENTS -->
    <!-- ========================================== -->
    <g transform="translate(800, 440)" filter="url(#card-shadow)">
      <rect width="290" height="205" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="290" height="32" rx="6" fill="#0f172a"/>
      <rect y="26" width="290" height="6" fill="#0f172a"/>
      <text x="145" y="21" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">documents</text>
      <!-- Columns -->
      <g transform="translate(14, 48)" font-family="monospace" font-size="11">
        <!-- PK id -->
        <rect x="0" y="-10" width="22" height="13" rx="2" fill="#0f172a"/>
        <text x="11" y="0" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Arial">PK</text>
        <text x="28" y="0" font-weight="700" fill="#0f172a">id</text>
        <text x="260" y="0" fill="#64748b" text-anchor="end">uuid</text>

        <!-- FK enrollment_id -->
        <g transform="translate(0, 22)">
          <rect x="0" y="-10" width="22" height="13" rx="2" fill="#e0f2fe" stroke="#bae6fd" stroke-width="0.5"/>
          <text x="11" y="0" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle" font-family="Arial">FK</text>

        <g transform="translate(0, 44)">
          <text x="28" y="0" font-weight="600" fill="#0f172a">document_type</text>
          <text x="260" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- file_path / url -->
        <g transform="translate(0, 66)">
          <text x="28" y="0" fill="#334155">file_path</text>
          <text x="260" y="0" fill="#64748b" text-anchor="end">text</text>
        </g>
        <!-- verification_status -->
        <g transform="translate(0, 88)">
          <text x="28" y="0" font-weight="600" fill="#b45309">verification_status</text>
          <text x="260" y="0" fill="#64748b" text-anchor="end">text</text>

        <!-- uploaded_at -->
        <g transform="translate(0, 110)">

          <text x="260" y="0" fill="#64748b" text-anchor="end">timestamptz</text>
        </g>
      </g>
    </g>
  </svg>
</body>
</html>
